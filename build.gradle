import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
	id 'com.gradleup.shadow' version "${shadow_version}"
	id 'maven-publish'
}

configurations {
	shade
	implementation.extendsFrom shade
}

apply from: 'gradle/common.gradle'

kotlin {
	compilerOptions {
		jvmTarget = JvmTarget.fromTarget(project.java_version)
		apiVersion = KotlinVersion.KOTLIN_2_0
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"

	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	shade("gg.essential:universalcraft-${project.universalcraft_version}-fabric:${project.universalcraft_build}") { transitive = false }
	shade("gg.essential:elementa:${project.elementa_version}") { transitive = false }

	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	productionRuntimeMods "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"
}

jar {
	enabled = false
}

shadowJar {
	archiveClassifier = ""
	configurations = [project.configurations.shade]
}

tasks.build.dependsOn shadowJar

tasks.register('runProductionClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	dependsOn shadowJar, tasks.named('gametestJar')
	mods.from(shadowJar.archiveFile, tasks.named('gametestJar').flatMap { it.archiveFile })
	jvmArgs.add("-Dfabric.client.gametest")
	jvmArgs.add("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
}
