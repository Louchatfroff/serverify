name: Build jars

on:
  workflow_call:
    inputs:
      version:
        description: Mod version to stamp on the jars (defaults to gradle.properties)
        type: string
        default: ""

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.read.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "include=$(jq -c . .github/versions.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.publish }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test ${{ matrix.name }}
        env:
          MOD_VERSION: ${{ inputs.version }}
          ENTRY: ${{ toJSON(matrix) }}
        run: |
          VERSION="${MOD_VERSION#v}"
          mapfile -t ARGS < <(echo "$ENTRY" | jq -r 'del(.name, .publish) | to_entries[] | "-P" + .key + "=" + (.value | tostring)')
          ./gradlew build --no-daemon "${ARGS[@]}" ${VERSION:+-Pversion="$VERSION"}
      - uses: actions/upload-artifact@v4
        if: matrix.publish
        with:
          name: serverify-${{ matrix.name }}
          path: |
            build/libs/serverify-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-gametest*.jar
            !build/libs/*-dev*.jar
          if-no-files-found: error
