name: Build jars

on:
  workflow_call:
    inputs:
      version:
        description: Mod version to stamp on the jars (defaults to gradle.properties)
        type: string
        default: ""

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.read.outputs.include }}
      legacy: ${{ steps.read.outputs.legacy }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          echo "include=$(jq -c 'map(select(.legacy | not))' .github/versions.json)" >> "$GITHUB_OUTPUT"
          echo "legacy=$(jq -c 'map(select(.legacy))' .github/versions.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.publish }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test ${{ matrix.name }}
        env:
          MOD_VERSION: ${{ inputs.version }}
          ENTRY: ${{ toJSON(matrix) }}
        run: |
          VERSION="${MOD_VERSION#v}"
          mapfile -t ARGS < <(echo "$ENTRY" | jq -r 'del(.name, .publish) | to_entries[] | "-P" + .key + "=" + (.value | tostring)')
          ./gradlew build --no-daemon "${ARGS[@]}" ${VERSION:+-Pversion="$VERSION"}
      - uses: actions/upload-artifact@v4
        if: matrix.publish
        with:
          name: serverify-${{ matrix.name }}
          path: |
            build/libs/serverify-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-gametest*.jar
            !build/libs/*-dev*.jar
          if-no-files-found: error

  legacy:
    needs: matrix
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.publish }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.legacy) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      - name: Build ${{ matrix.name }}
        working-directory: legacy
        env:
          MOD_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${MOD_VERSION#v}"
          ./gradlew ":${{ matrix.project }}:build" --no-daemon ${VERSION:+-Pmod_version="$VERSION"}
      - uses: actions/upload-artifact@v4
        if: matrix.publish
        with:
          name: serverify-${{ matrix.name }}
          path: |
            legacy/versions/${{ matrix.project }}/build/libs/serverify-*.jar
            !legacy/versions/${{ matrix.project }}/build/libs/*-dev.jar
          if-no-files-found: error
