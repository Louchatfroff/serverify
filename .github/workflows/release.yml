name: Release

on:
  push:
    tags: ["v*"]

jobs:
  jars:
    uses: ./.github/workflows/jars.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: jars
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: serverify-mc*
          merge-multiple: true
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.jar --repo "${{ github.repository }}" --title "Serverify ${{ github.ref_name }}" --generate-notes

  modrinth:
    needs: publish
    uses: ./.github/workflows/modrinth.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
