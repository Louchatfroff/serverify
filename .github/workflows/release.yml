name: Release

on:
  push:
    tags: ["v*"]

jobs:
  jars:
    uses: ./.github/workflows/jars.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: jars
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: serverify-*
          merge-multiple: true
          path: dist
      - name: Write the release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## " v "$" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "Serverify ${GITHUB_REF_NAME}" > notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.jar --repo "${{ github.repository }}" --title "Serverify ${{ github.ref_name }}" --notes-file notes.md

  modrinth:
    needs: publish
    uses: ./.github/workflows/modrinth.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
