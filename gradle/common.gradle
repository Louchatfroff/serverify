repositories {
	maven { url = 'https://maven.terraformersmc.com/' }
	maven { url = 'https://maven.dediamondpro.dev/releases' }
	maven { url = 'https://repo.essential.gg/repository/maven-public/' }
}

loom {
	mods {
		"serverify" {
			sourceSet sourceSets.main
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "serverify-test"
		enableGameTests = false
		enableClientGameTests = true
	}
}

sourceSets.main.java.srcDir "src/compat/${project.compat}/java"

dependencies {
	shade "org.jsoup:jsoup:${project.jsoup_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

base {
	archivesName = "serverify-mc${project.minecraft_version}"
}

processResources {
	def props = [version: project.version, minecraft_range: project.minecraft_range, java_version: project.java_version]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version as int
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

shadowJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	mergeServiceFiles()
	relocate "gg.essential.universal", "com.serverify.libs.universal"
	relocate "gg.essential.elementa", "com.serverify.libs.elementa"
	relocate "org.jsoup", "com.serverify.libs.jsoup"

	def projectName = project.name
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

tasks.register('gametestJar', Jar) {
	archiveClassifier = "gametest"
	from sourceSets.gametest.output
}

if (project.findProperty('smoke') == 'true') {
	sourceSets.gametest.java.srcDirs = ['src/smoke/java']
	sourceSets.gametest.resources.srcDirs = ['src/smoke/resources']
}
