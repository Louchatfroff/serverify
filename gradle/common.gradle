repositories {
	maven { url = 'https://maven.terraformersmc.com/' }
	maven { url = 'https://maven.dediamondpro.dev/releases' }
	maven { url = 'https://repo.essential.gg/repository/maven-public/' }
	maven { url = 'https://maven.minecraftforge.net' }
	maven { url = 'https://maven.neoforged.net/releases/' }
	maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
}

loom {
	mods {
		"serverify" {
			sourceSet sourceSets.main
		}
	}
}

sourceSets.main.java.srcDirs "src/compat/${project.compat}/java", "src/loader/${project.findProperty("loader_dir") ?: project.loader}/java", "src/compat/${project.compat}/${project.loader}/java"

sourceSets.main.kotlin.srcDir "src/kind/${project.findProperty("kind") ?: "modern"}/kotlin"

if (project.findProperty("smoke_main")) {
	sourceSets.main.java.srcDirs "src/smoke-main${project.findProperty('smoke_main') == 'true' ? '' : project.findProperty('smoke_main')}/java"
}

dependencies {
	shade "org.jsoup:jsoup:${project.jsoup_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

base {
	archivesName = "serverify-${project.loader}-mc${project.minecraft_version}"
}

processResources {
	def props = [version: project.version, minecraft_range: project.minecraft_range, java_version: project.java_version,
				 fabric_api_id: project.fabric_api_id, forge_mc_range: project.findProperty('forge_mc_range') ?: '',
				 neoforge_range: project.findProperty("neoforge_range") ?: "[1,)", pack_fields: ((project.findProperty("pack_format") ?: "15") as int) >= 65 ? "\"min_format\": ${project.findProperty("pack_format")}, \"max_format\": ${project.findProperty("pack_format")}" : "\"pack_format\": ${project.findProperty("pack_format") ?: "15"}"]
	inputs.properties props

	filesMatching(["fabric.mod.json", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "pack.mcmeta"]) {
		expand props
	}
	if (project.loader != 'fabric') exclude "fabric.mod.json"
	if (project.loader == 'neoforge' && project.findProperty('neo_legacy_toml')) {
		filesMatching("META-INF/neoforge.mods.toml") {
			path = "META-INF/mods.toml"
		}
	}
	if (project.loader == 'fabric') {
		exclude "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "pack.mcmeta"
	} else if (project.loader == 'forge') {
		exclude "META-INF/neoforge.mods.toml"
	} else {
		exclude "META-INF/mods.toml"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = (project.java_version as int)
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

shadowJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	mergeServiceFiles()
	relocate "gg.essential.universal", "com.serverify.libs.universal"
	relocate "gg.essential.elementa", "com.serverify.libs.elementa"
	relocate "org.jsoup", "com.serverify.libs.jsoup"
	if (project.loader != 'fabric') exclude "fabric.mod.json"
	if (project.loader == 'neoforge' && project.findProperty('neo_legacy_toml')) {
		filesMatching("META-INF/neoforge.mods.toml") {
			path = "META-INF/mods.toml"
		}
	}

	def projectName = project.name
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

if (project.findProperty('run_jdk')) {
	tasks.withType(JavaExec).configureEach {
		executable = "${project.run_jdk}/bin/java.exe"
	}
}

tasks.named('compileTestJava') {
	options.release = Math.max(17, project.java_version as int)
}
